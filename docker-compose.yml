services:
  postgres:
    image: postgres:16
    container_name: kanbanic-postgres
    environment:
      POSTGRES_PASSWORD: kanbanic123
      POSTGRES_DB: kanbanic_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    container_name: kanbanic-auth-service
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kanbanic_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: kanbanic123
      TZ: Asia/Kolkata

volumes:
  postgres_data: